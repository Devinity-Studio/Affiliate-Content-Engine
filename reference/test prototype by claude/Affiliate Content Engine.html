<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Affiliate Content Engine</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: Daily Brief + three-column workflow shell (steps | workspace | gates and history); stacks on phones */
:root{
  --bg:#eef2f3; --surface:#fbfcfc; --ink:#13232c; --muted:#566872;
  --line:#cfd9dd; --line-soft:#e1e8eb;
  --accent:#0a6f8f; --accent-ink:#ffffff; --accent-soft:#d9eef4;
  --good:#1d7a4b; --good-soft:#dcf1e5;
  --warn:#9a5b06; --warn-soft:#fbecd2;
  --crit:#b3261e; --crit-soft:#fbe0dd;
  --font:'IBM Plex Sans Thai',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0d1519; --surface:#141d22; --ink:#e4ecf0; --muted:#92a4ae;
    --line:#27363e; --line-soft:#1d2a31;
    --accent:#52c3e3; --accent-ink:#06222c; --accent-soft:#12303b;
    --good:#5ccf93; --good-soft:#12301f;
    --warn:#e8b25a; --warn-soft:#352610;
    --crit:#f2877f; --crit-soft:#391a18;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0d1519; --surface:#141d22; --ink:#e4ecf0; --muted:#92a4ae;
  --line:#27363e; --line-soft:#1d2a31;
  --accent:#52c3e3; --accent-ink:#06222c; --accent-soft:#12303b;
  --good:#5ccf93; --good-soft:#12301f;
  --warn:#e8b25a; --warn-soft:#352610;
  --crit:#f2877f; --crit-soft:#391a18;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.6}
.app{max-width:1280px;margin:0 auto;padding-block:16px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3,p,ul{margin:0}
h1{font-size:18px;font-weight:600;letter-spacing:.01em}
h2{font-size:20px;font-weight:600;text-wrap:balance}
h3{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* top bar */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.brand{min-width:0;flex:1 1 240px}
.brand p{color:var(--muted);font-size:12px}
.tabs{display:flex;gap:4px;background:var(--line-soft);padding:3px;border-radius:8px}
.tab{border:0;background:transparent;padding:6px 14px;border-radius:6px;font-weight:500;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);padding:6px 12px;border-radius:6px}
.btn:hover{border-color:var(--accent)}
.btn.ghost{background:transparent}
.btn.warn{border-color:var(--warn);color:var(--warn)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.notice{margin-top:12px;padding:8px 12px;background:var(--warn-soft);color:var(--ink);border-left:3px solid var(--warn);font-size:13px}

/* shell */
.shell{display:grid;grid-template-columns:224px minmax(0,1fr) 270px;gap:20px;margin-top:16px;align-items:start}
.steps{display:flex;flex-direction:column;gap:2px;min-width:0}
.steps .prog{font-size:12px;color:var(--muted);padding:0 10px 8px}
.step{display:grid;grid-template-columns:24px minmax(0,1fr);gap:2px 8px;text-align:left;border:0;background:transparent;padding:8px 10px;border-radius:6px;border-left:3px solid transparent}
.step:disabled{opacity:.5;cursor:not-allowed}
.step[aria-current="step"]{background:var(--surface);border-left-color:var(--accent);box-shadow:0 0 0 1px var(--line)}
.step .n{font-family:var(--mono);color:var(--muted);font-size:12px;padding-top:2px}
.step .nm{font-weight:500}
.step .st{grid-column:2;display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.chip{display:inline-block;font-size:11px;line-height:1.5;padding:0 7px;border-radius:99px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.DONE,.chip.ok{background:var(--good-soft);border-color:transparent;color:var(--good)}
.chip.IN_PROGRESS{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.chip.STALE,.chip.warn{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.chip.HALT,.chip.crit{background:var(--crit-soft);border-color:transparent;color:var(--crit)}
.loopnote{margin:12px 10px 0;font-size:12px;color:var(--muted)}

.main{min-width:0;display:flex;flex-direction:column}
.work{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:20px;min-width:0}
fieldset{border:0;margin:0;padding:0;min-width:0;display:flex;flex-direction:column;gap:16px}
fieldset:disabled{opacity:.7}
.lead{color:var(--muted);max-width:68ch}
.banner{margin-bottom:12px;padding:8px 12px;border-radius:6px;font-size:13px;border-left:3px solid var(--accent);background:var(--accent-soft)}
.banner.stale{border-left-color:var(--warn);background:var(--warn-soft)}
.banner.done{border-left-color:var(--good);background:var(--good-soft)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld>span{font-size:12px;color:var(--muted)}
.fld.grow{flex:1 1 180px}
input[type=text],input[type=number],input[type=url],select,textarea{width:100%;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:7px 9px}
textarea{resize:vertical}
input:disabled,select:disabled,textarea:disabled{cursor:not-allowed}
.chk{display:flex;gap:8px;align-items:flex-start}
.chk input{margin-top:5px}
.rows{display:flex;flex-direction:column;gap:10px}
.crow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:flex-end;padding-bottom:10px;border-bottom:1px solid var(--line-soft)}
.crow>input[type=radio]{margin:0 0 12px;flex:none}
.crow .fld.sm{flex:0 0 120px}
.crow .fld.md{flex:0 0 150px}
.icon{border:1px solid var(--line);background:transparent;border-radius:6px;padding:6px 10px;color:var(--muted)}
.hint{font-size:12px;color:var(--muted)}
.calc{display:flex;flex-wrap:wrap;gap:6px 24px;padding:10px 12px;background:var(--bg);border:1px dashed var(--line);border-radius:6px}
.calc div{min-width:0}
.calc small{display:block;font-size:12px;color:var(--muted)}
.calc b{font-family:var(--mono);font-weight:500;font-size:16px}
.gate{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;padding:10px 12px;border:1px solid var(--line);border-radius:6px}
.gate.on{border-color:var(--good);background:var(--good-soft)}
.gate p{font-size:12px;color:var(--muted)}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:760px}
th{font-size:12px;font-weight:500;color:var(--muted);text-align:left;padding:4px 6px}
td{padding:4px 6px;vertical-align:top}
td input{min-width:80px}
.scenes{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.preview{aspect-ratio:16/7;max-width:100%;border:1px solid var(--line);border-radius:6px;display:grid;place-items:center;background:var(--bg);color:var(--muted);text-align:center;padding:8px}
.carry{padding:10px 12px;background:var(--accent-soft);border-radius:6px}
.carry ul{padding-left:18px;margin-top:4px}
.checks{display:flex;flex-direction:column;gap:6px}
.auto{display:flex;gap:8px;align-items:center}

/* nav */
.nav{position:sticky;bottom:env(safe-area-inset-bottom,0px);margin-top:12px;padding:10px 0 4px;background:linear-gradient(to top,var(--bg) 80%,transparent)}
.todo{margin-bottom:8px;padding:8px 12px;background:var(--crit-soft);border-radius:6px;font-size:13px}
.todo ul{padding-left:18px}
.btns{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.nb{display:flex;flex-direction:column;align-items:center;gap:0;padding:8px;border:1px solid var(--line);background:var(--surface);border-radius:8px}
.nb span{font-weight:600}
.nb small{color:var(--muted);font-size:12px}
.nb.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.nb.primary small{color:inherit;opacity:.85}
.nb:disabled{opacity:.45;cursor:not-allowed}

/* aside */
aside{display:flex;flex-direction:column;gap:18px;min-width:0}
aside section{display:flex;flex-direction:column;gap:6px}
.gl,.rules,.log{list-style:none;padding:0;display:flex;flex-direction:column;gap:4px;font-size:13px}
.gl li{display:flex;justify-content:space-between;gap:8px}
.rules li{padding-left:12px;position:relative;color:var(--muted)}
.rules li::before{content:"";position:absolute;left:0;top:.7em;width:5px;height:1px;background:var(--muted)}
.log li{display:grid;grid-template-columns:44px minmax(0,1fr);gap:6px;color:var(--muted)}
.log .t{font-family:var(--mono);font-size:12px}
.log .BLOCKED{color:var(--crit)}
.log .OK{color:var(--ink)}

/* brief */
.brief{margin-top:16px;display:flex;flex-direction:column;gap:22px}
.brief h2{margin-bottom:2px}
.cols{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:24px;align-items:start}
.opps{display:flex;flex-direction:column;gap:12px}
.opp{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.opp dl{margin:0;display:grid;grid-template-columns:110px minmax(0,1fr);gap:4px 12px;font-size:13px}
.opp dt{color:var(--muted)}
.opp dd{margin:0}
.opp .acts{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.list{list-style:none;padding:0;display:flex;flex-direction:column}
.list li{padding:8px 0;border-bottom:1px solid var(--line-soft);display:grid;grid-template-columns:34px minmax(0,1fr);gap:8px}
.list .p{font-family:var(--mono);font-size:12px;color:var(--muted);padding-top:2px}
.list small{display:block;color:var(--muted)}

@media (max-width:1000px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .steps{flex-direction:row;overflow-x:auto;gap:6px;padding-bottom:6px}
  .steps .prog,.steps .loopnote{display:none}
  .step{flex:0 0 150px;border:1px solid var(--line);border-left-width:3px}
  .cols{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:520px){
  .work{padding:14px}
  .opp dl{grid-template-columns:minmax(0,1fr)}
  .opp dt{margin-top:4px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>

<div class="app">
  <header class="top">
    <div class="brand"><h1>Affiliate Content Engine</h1><p id="meta"></p></div>
    <div class="tabs" role="tablist" aria-label="มุมมอง">
      <button class="tab" id="tabBrief" role="tab" data-act="view" data-v="brief">Daily Brief</button>
      <button class="tab" id="tabFlow" role="tab" data-act="view" data-v="flow">Workflow 10 ขั้น</button>
    </div>
    <div class="tools">
      <button class="btn ghost" id="btnSample" data-act="sample">โหลดข้อมูลตัวอย่าง</button>
      <button class="btn ghost" id="btnReset" data-act="reset">เริ่มใหม่</button>
    </div>
  </header>
  <p class="notice" role="note">ต้นแบบสำหรับทดลองการไหลของ workflow และ gate ข้อมูลตลาด สินค้า และตัวเลขทั้งหมดเป็นตัวอย่าง ไม่เชื่อมแพลตฟอร์มจริง ไม่เผยแพร่ ไม่ใช้เงิน บันทึกอยู่ในเบราว์เซอร์นี้เท่านั้น</p>

  <section id="brief" class="brief" aria-label="Daily Brief"></section>

  <section id="flow" class="shell" aria-label="Workflow">
    <nav id="steps" class="steps" aria-label="ขั้นตอน"></nav>
    <div class="main">
      <div id="banner"></div>
      <div id="work" class="work"></div>
      <div id="nav" class="nav"></div>
    </div>
    <aside id="aside"></aside>
  </section>
</div>

<script>
(function(){
'use strict';
var KEY='ace-proto-v1';
var NAMES=['Research','Work Plan','Storyboard','Video Editor','Text','Music & SFX','Finalize','Publish','Monitor','Report & Learn'];
var SUB=['ค้นหาโอกาส','แผนและ experiment','บทและฉาก','ตัดต่อรายฉาก','ข้อความบนจอ','เสียงและสิทธิ์','ตรวจก่อนเผยแพร่','เผยแพร่ด้วยมือ','ติดตามผลจริง','สรุปและเรียนรู้'];
var GATE={1:'g2',6:'g3',7:'g4',9:'g5'};
var GLABEL={g2:'G2 Experiment',g3:'G3 Content',g4:'G4 Publish',g5:'G5 Report'};
var STAT={NOT_STARTED:'ยังไม่เริ่ม',IN_PROGRESS:'กำลังทำ',DONE:'ยืนยันแล้ว',STALE:'ต้องตรวจใหม่'};
var CLS=[['FACT','Fact'],['INFERENCE','Inference'],['HYPOTHESIS','Hypothesis'],['UNKNOWN','Unknown']];
var LINKS=[['PROFILE_BIO','ลิงก์ในโปรไฟล์ (bio)'],['NATIVE_TAG','แท็กสินค้าของแพลตฟอร์ม'],['DEEP_LINK','ลิงก์ตรงในโพสต์'],['OTHER','อื่น ๆ']];
var BRIEF=[
 {id:'b1',t:'ตากผ้าไม่แห้งในคอนโดช่วงฝน',why:'คำถามซ้ำเรื่องรุ่นและขนาดเพิ่มขึ้นต่อเนื่องหลายสัปดาห์',aud:'คนอยู่คอนโดและห้องเช่า',interest:'สูง',intent:'กลาง: ถามราคาและความเหมาะกับห้อง',ready:'ยังไม่มีสื่อจริง',conf:'ต่ำถึงกลาง',ev:'INFERENCE'},
 {id:'b2',t:'จัดระเบียบห้องเล็กโดยไม่เจาะผนัง',why:'คำถามเรื่องการติดตั้งซ้ำ ยังไม่มีคอนเทนต์ตอบตรงจุด',aud:'ผู้เช่าห้องขนาดเล็ก',interest:'กลาง',intent:'สูง: เปรียบเทียบรุ่นก่อนซื้อ',ready:'มีภาพสินค้าจากผู้ขาย รอยืนยันสิทธิ์',conf:'กลาง',ev:'FACT'},
 {id:'b3',t:'เก็บสายชาร์จบนโต๊ะทำงาน',why:'กระแสสั้น จากโพสต์ไม่กี่แหล่งที่ซ้ำกัน',aud:'คนทำงานที่บ้าน',interest:'สูง',intent:'ยังไม่พบหลักฐาน',ready:'ยังไม่ตรวจสินค้า',conf:'ต่ำ',ev:'HYPOTHESIS'}
];

function fresh(){
  return {
    cycle:1,cur:0,editing:false,view:'brief',archived:false,carry:[],brief:{},log:[],
    steps:Array.from({length:10},function(_,i){return {status:i===0?'IN_PROGRESS':'NOT_STARTED',v:1,why:''}}),
    gates:{g2:false,g3:false,g4:false,g5:false,gpay:false},
    d:freshData()
  };
}
function freshData(){
  return {
    cands:[{name:'',src:'',cls:'UNKNOWN'},{name:'',src:'',cls:'UNKNOWN'},{name:'',src:'',cls:'UNKNOWN'}],sel:-1,
    p:{rate:'',conv:'',clicks:'',aov:'',days:14,budget:0,channel:'facebook',link:'PROFILE_BIO',crit:''},
    dna:'',
    claims:[{t:'',kind:'fact',ev:''}],disc:'',
    scenes:[{t:'00–05s',n:''},{t:'05–10s',n:''},{t:'10–15s',n:''}],
    asset:{file:'',tools:'',quota:'OK',spent:0},
    text:{overlay:'',disc:false},
    music:{track:'',lic:'NO'},
    fin:{c1:false,c2:false,c3:false},
    pub:{url:'',at:'',link:'PROFILE_BIO',disc:'',shot:false},
    obs:[{k:'D+3',src:'',clicks:'',orders:'',label:'',m1:'',cost:'',m2:''},{k:'D+7',src:'',clicks:'',orders:'',label:'',m1:'',cost:'',m2:''},{k:'END',src:'',clicks:'',orders:'',label:'',m1:'',cost:'',m2:''}],
    win:{days:''},
    rep:{rec:'REPEAT',trend:'INCONCLUSIVE',week:'W12',learn:'',learnCls:'HYPOTHESIS'}
  };
}
var S;
try{var raw=localStorage.getItem(KEY);S=raw?JSON.parse(raw):null}catch(e){S=null}
if(!S||!S.d||!S.steps||S.steps.length!==10||!S.d.obs){S=fresh()}

var $=function(s){return document.querySelector(s)};
function esc(v){return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function num(v){return v!==''&&v!=null&&!isNaN(Number(v))}
function fmt(n){return Number(n).toLocaleString('th-TH',{maximumFractionDigits:2})}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function now(){return new Date().toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'})}
function log(a,r){S.log.unshift({t:now(),a:a,r:r||'INFO'});if(S.log.length>40)S.log.length=40}
function get(p){return p.split('.').reduce(function(o,k){return o==null?o:o[k]},S.d)}
function set(p,v){var ks=p.split('.');var last=ks.pop();var o=ks.reduce(function(o,k){return o[k]},S.d);o[last]=v}
function isLocked(i){return S.steps[i].status==='DONE'&&!(S.editing&&i===S.cur)}
function reach(){var r=0;S.steps.forEach(function(s,i){if(s.status!=='NOT_STARTED')r=i});return r}

/* ---------- validation ---------- */
function claimsOk(){return S.d.claims.every(function(c){return c.t.trim()&&(c.kind!=='fact'||c.ev.trim())})}
function validate(i){
  var D=S.d,e=[];
  if(i===0){
    if(D.cands.filter(function(c){return c.name.trim()}).length<3)e.push('ต้องมีอย่างน้อย 3 โอกาสที่มีชื่อ');
    var c=D.cands[D.sel];
    if(!c)e.push('เลือก 1 โอกาสสำหรับรอบนี้');
    else{
      if(!c.src.trim())e.push('โอกาสที่เลือกต้องมีแหล่งอ้างอิง (URL)');
      if(c.cls!=='FACT'&&c.cls!=='INFERENCE')e.push('โอกาสที่เลือกต้องเป็น Fact หรือ Inference ที่ตรวจแล้ว ไม่ใช่ Unknown หรือ Hypothesis');
    }
  }
  if(i===1){
    var p=D.p;
    [['rate','อัตราคอมมิชชัน'],['conv','อัตราแปลงเป็นคำสั่งซื้อ'],['clicks','จำนวนคลิก'],['aov','มูลค่าต่อคำสั่งซื้อ']].forEach(function(f){if(!num(p[f[0]])||Number(p[f[0]])<=0)e.push('กรอก'+f[1]+' (ค่าที่ยังไม่ยืนยันให้ถือเป็นสมมติฐาน)')});
    if(!p.crit.trim())e.push('กำหนดเกณฑ์สำเร็จที่วัดได้จาก dashboard');
    if(!num(p.days)||Number(p.days)<=0)e.push('กำหนดระยะเวลาทดลอง');
    if(!num(p.budget)||Number(p.budget)<0)e.push('กรอกงบ (ค่าเริ่มต้น 0)');
    if(num(p.budget)&&Number(p.budget)>0&&!S.gates.gpay)e.push('งบมากกว่า 0 ต้องผ่าน G-pay ก่อน');
    if(!S.gates.g2)e.push('รอ Owner อนุมัติ G2');
  }
  if(i===2){

function labelOf(list,v){var f=list.filter(function(x){return x[0]===v})[0];return f?f[1]:v}

/* ---------- invalidation ---------- */
function touch(k){
  var st=S.steps[k];
  if(st.status==='DONE'){st.status='IN_PROGRESS';st.v++;log('แก้ขั้น '+(k+1)+' เป็นเวอร์ชัน v'+st.v)}
  var g=GATE[k];
  if(g&&S.gates[g]){S.gates[g]=false;log('ถอน '+GLABEL[g]+' เพราะข้อมูลเปลี่ยน','BLOCKED')}
  for(var i=k+1;i<10;i++){
    var s=S.steps[i];
    if(s.status==='DONE'){
      s.status='STALE';s.why='ขั้น '+(k+1)+' '+NAMES[k]+' ถูกแก้ไข';
      if(GATE[i])S.gates[GATE[i]]=false;
      log('ขั้น '+(i+1)+' ต้องตรวจใหม่ เพราะขั้น '+(k+1)+' เปลี่ยน','BLOCKED');
    }
  }
}

/* ---------- calculations ---------- */
function calc(){
  var p=S.d.p,o=S.d.obs[2],w=S.d.win;
  var rev=(num(p.clicks)&&num(p.conv)&&num(p.aov)&&num(p.rate))?p.clicks*p.conv/100*p.aov*p.rate/100:null;
  var ready=Number(w.days)===14&&num(o.m1)&&num(o.cost);
  var net=ready?Number(o.m1)-Number(o.cost):null;
  var daily=ready?net/14:null;
  var verdict;
  if(!ready)verdict='not yet measurable: หลักฐานในหน้าต่าง 14 วันยังไม่ครบ หรือยังไม่มีค่า M1 และต้นทุนของ END';
  else verdict=daily>=1000?'ถึงเป้า THB 1,000/วัน ในหน้าต่างนี้ (ต้องมีหลักฐานว่าซ้ำได้)':'ยังไม่ถึงเป้า THB 1,000/วัน';
  return {rev:rev,ready:ready,net:net,daily:daily,verdict:verdict};
}
function renderCalcs(){
  var c=calc();
  var map={rev:c.rev==null?'ยังไม่ครบ':fmt(c.rev)+' THB',net:c.net==null?'not yet measurable':fmt(c.net)+' THB',daily:c.daily==null?'not yet measurable':fmt(c.daily)+' THB/วัน',verdict:c.verdict};
  document.querySelectorAll('[data-calc]').forEach(function(el){el.textContent=map[el.dataset.calc]});
}

function closeCycle(){
  var r=S.d.rep;
  S.carry.push({c:S.cycle,t:r.learn,cls:r.learnCls});
  if(r.rec==='STOP'){S.archived=true;log('G5: Stop ปิดรอบ '+S.cycle,'OK');return}
  var prev=S.cycle;S.cycle++;
  S.steps=fresh().steps;S.gates={g2:false,g3:false,g4:false,g5:false,gpay:false};
  var D=S.d,f=freshData();D.obs=f.obs;D.pub=f.pub;D.fin=f.fin;D.win=f.win;D.sel=-1;D.rep=f.rep;
  S.cur=0;S.editing=false;
  log('G5: '+r.rec+' เริ่มรอบ '+S.cycle+' พร้อมบทเรียนจากรอบ '+prev,'OK');
}
function sendBrief(id){
  var b=BRIEF.filter(function(x){return x.id===id})[0];
  var name=b.t+' (ตัวอย่าง)';
  if(!S.d.cands.some(function(c){return c.name===name})){
    var empty=S.d.cands.findIndex(function(c){return !c.name.trim()});
    var item={name:name,src:'',cls:'UNKNOWN'};
    if(empty>=0)S.d.cands[empty]=item;else S.d.cands.push(item);
    if(S.steps[0].status==='DONE')touch(0);
  }
  S.brief[id]='sent';S.view='flow';S.cur=0;S.editing=false;
  if(S.steps[0].status==='NOT_STARTED')S.steps[0].status='IN_PROGRESS';
  log('ส่งโอกาส “'+b.t+'” เข้า Research');
  renderBrief();refresh(true);
}
var resetArmed=false,resetTimer=null;

document.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');if(!b||b.disabled)return;
  var a=b.dataset.act,i=Number(b.dataset.i);
  if(a==='view'){S.view=b.dataset.v;refresh(false);return}
  if(a==='sample'){fillSample();return}
  if(a==='reset'){
    if(!resetArmed){resetArmed=true;b.textContent='กดอีกครั้งเพื่อยืนยัน';b.classList.add('warn');resetTimer=setTimeout(function(){resetArmed=false;b.textContent='เริ่มใหม่';b.classList.remove('warn')},3500);return}
    clearTimeout(resetTimer);resetArmed=false;b.textContent='เริ่มใหม่';b.classList.remove('warn');
    var v=S.view;S=fresh();S.view=v;log('เริ่มใหม่ทั้งหมด');renderAll();return;
  }
  if(a==='step'){S.cur=i;S.editing=false;refresh(true);return}
  if(a==='prev'){if(S.cur>0){S.cur--;S.editing=false;refresh(true)}return}
  if(a==='edit'){
    if(isLocked(S.cur)){S.editing=true;log('เปิดแก้ขั้น '+(S.cur+1))}
    else if(S.editing){S.editing=false}
    refresh(true);
    if(!S.editing){var f=$('#work input:not([type=radio]),#work textarea,#work select');if(f&&!isLocked(S.cur)&&e.detail===0)f.focus()}
    return;
  }
  if(a==='next'){
    var k=S.cur,st=S.steps[k];
    if(isLocked(k)){if(k<9)S.cur=k+1;S.editing=false;refresh(true);return}
    var errs=validate(k);
    if(errs.length){log('Next ขั้น '+(k+1)+' ถูกบล็อก','BLOCKED');refresh(true);return}
    st.status='DONE';st.why='';S.editing=false;log('ยืนยันขั้น '+(k+1)+' '+NAMES[k]+' v'+st.v,'OK');
    if(k===9){closeCycle()}
    else{S.cur=k+1;if(S.steps[S.cur].status==='NOT_STARTED')S.steps[S.cur].status='IN_PROGRESS'}
    refresh(true);window.scrollTo(0,0);return;
  }
  if(a==='gate'){
    var g=b.dataset.g;
    if(S.gates[g]){S.gates[g]=false;log('ถอน '+(GLABEL[g]||'G-pay'),'BLOCKED');if(S.steps[S.cur].status==='DONE')touch(S.cur)}
    else{S.gates[g]=true;log('Owner อนุมัติ '+(GLABEL[g]||'G-pay'),'OK')}
    refresh(true);return;
  }
  if(a==='addCand'){S.d.cands.push({name:'',src:'',cls:'UNKNOWN'});touch(0);refresh(true);return}
  if(a==='rmCand'){S.d.cands.splice(i,1);if(S.d.sel===i)S.d.sel=-1;else if(S.d.sel>i)S.d.sel--;touch(0);refresh(true);return}
  if(a==='addClaim'){S.d.claims.push({t:'',kind:'fact',ev:''});touch(2);refresh(true);return}
  if(a==='rmClaim'){S.d.claims.splice(i,1);touch(2);refresh(true);return}
  if(a==='bsend'){sendBrief(b.dataset.id);return}
  if(a==='bhold'||a==='bskip'){S.brief[b.dataset.id]=a==='bhold'?'hold':'skip';save();renderBrief();return}
});
function onField(e){
  var el=e.target,b=el.dataset&&el.dataset.b;if(!b)return;
  var v;
  if(el.type==='checkbox')v=el.checked;
  else if(el.type==='radio')v=Number(el.value);
  else if(el.dataset.t==='num')v=el.value===''?'':Number(el.value);
  else v=el.value;
  var changed=String(get(b))!==String(v);
  if(changed){set(b,v);touch(S.cur)}
  var full=e.type==='change'&&(b==='asset.quota'||b==='p.budget'||b==='asset.spent'||b==='pub.link'||b==='sel');
  if(changed||full)refresh(full);
}
$('#work').addEventListener('input',onField);
$('#work').addEventListener('change',onField);

renderAll();
})();
